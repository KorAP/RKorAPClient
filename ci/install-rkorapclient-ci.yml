.install-rkorapclient:
  variables:
    # Set `CCACHE_BASEDIR` and `CCACHE_DIR` to point `ccache` towards the cached
    # path on the gitlab-runner. This enables to cache the output of `ccache`
    # between various runs.
    CCACHE_BASEDIR: ${CI_PROJECT_DIR}
    CCACHE_DIR: ${CI_PROJECT_DIR}/ccache
    # Set `ccache` to `content` to prevent rebuilding of the CI/CD containers to
    # trigger a recreate of the cache. By using `content` the compiler's `mtime`
    # is not considered as part of the hash.
    CCACHE_COMPILERCHECK: "content"
    # Enable caching for `apt-get`.
    APT_CACHE_DIR: ${CI_PROJECT_DIR}/apt-cache
    # Export `noninteractive` frontend to prevent requesting user input
    DEBIAN_FRONTEND: noninteractive
    R_LIBS_USER: ${CI_PROJECT_DIR}/rlib

  cache:
    key: rkorapclient
    paths:
      - apt-cache/
      - ccache/
      - rlib/

  before_script:
    - source ./ci/section_helper.sh

    - start_section install_linux_packages "Installing missing Linux packages"
    - mkdir -pv $APT_CACHE_DIR ccache $R_LIBS_USER /usr/local/sbin ~/.ccache ~/.R
    # The cached library holds compiled code, which a newer R refuses to load -
    # with "undefined symbol", not by rebuilding it. As a cache key cannot be
    # derived from the image's R version, the library is discarded by hand when
    # that version changes.
    - task_r_version=$(R -s -e 'cat(R.version$major, R.version$minor, sep = ".")')
    - if [ "$(cat $R_LIBS_USER/.r-version 2>/dev/null)" != "$task_r_version" ]; then echo "R $task_r_version differs from the one the cached library was built for - rebuilding it"; rm -rf $R_LIBS_USER; mkdir -p $R_LIBS_USER; fi
    - echo "$task_r_version" > $R_LIBS_USER/.r-version
    - cp ci/Makevars ~/.R/Makevars
    - cp ci/ccache.conf ${CI_PROJECT_DIR}/ccache/ccache.conf
    - cp ci/ccache.conf ~/.ccache/ccache.conf
    - echo "R_LIBS='$R_LIBS_USER'" > .Renviron
    - echo "MAKEFLAGS=-j$(nproc)" >> ~/.R/Makevars
    - echo "MAKE=make -j$(nproc)" >> ~/.R/Makevars
    - apt-get update
    # Keep system dependencies here, independent of user-facing README examples.
    - >-
      apt-get install -y -o dir::cache::archives="$APT_CACHE_DIR" --no-install-recommends
      ccache libcurl4-openssl-dev libxml2-dev libsecret-1-dev libfontconfig1-dev
      libssl-dev libharfbuzz-dev libfribidi-dev
    - ln -s $(which ccache) /usr/local/sbin/gcc
    - ln -s $(which ccache) /usr/local/sbin/g++
    - end_section install_linux_packages
    - start_section installing "Installing RKorAPClient from source"
    - export PATH=/usr/local/sbin:$PATH
    - R -q -e "install.packages('pak', dependencies=TRUE)"
    - R -q -e 'pak::pak("devtools")'
    - end_section installing
    - start_section local_install "Installing RKorAPClient and test dependencies from source"
    - R -q -e 'pak::pak(".", dependencies = TRUE)'
    - ccache -s
    - end_section local_install
