include:
  - local: ci/install-rkorapclient-ci.yml

build-rkorapclient-on-stable:
  rules:
    # Preserve the original default exclusion of merge-request pipelines.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RKORAP_LIVE_TESTS == "true"'
      when: never
    - when: on_success
  extends: .install-rkorapclient
  image: rocker/tidyverse
  cache:
    key: rkorapclient-ubuntu-stable
    paths:
    - apt-cache/
    - ccache/
    - rlib/
  script:
    # The Readme documentation prompting tests query LLMs and are therefore
    # neither deterministic nor free. They run in their own job below, so that
    # neither a model's mood nor an empty API account can turn this one red.
    # Exported here rather than declared under variables:, since a project or
    # instance variable of that name would take precedence over the latter.
    - export RKORAP_LLM_MODELS=""
    - export RKORAP_BROWSER_TESTS=""
    - export RKORAP_LIVE_TESTS=""
    - start_section testing "Testing RKorAPClient"
    - echo -e "apt-cache\nccache\nrlib" >> .Rbuildignore
    - R -q -e "devtools::check(args = c('--no-examples'))"
    # The package check omits local servers and excludes the source README.
    - export NOT_CRAN=true
    - R -q -e 'devtools::test(filter = "^(http-transport|readme-consistency)$", stop_on_failure = TRUE)'
    - end_section testing

# Prompts LLMs with the Readme, to check that it still enables them to use the
# package. A failure here is a hint that the documentation has become unclear
# (or that a model had a bad day), not a broken build, hence allow_failure.
readme-doc-prompting-tests:
  rules:
    # Preserve the original default exclusion of merge-request pipelines.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RKORAP_LIVE_TESTS == "true"'
      when: never
    - when: on_success
  extends: .install-rkorapclient
  image: rocker/tidyverse
  allow_failure: true
  cache:
    key: rkorapclient-ubuntu-stable
    paths:
    - apt-cache/
    - ccache/
    - rlib/
  script:
    # GLM-5.3-Flash and GPT-6-Luna, both via OpenRouter, solve the
    # documentation tasks reliably, and as models of different families they
    # tend to stumble over different gaps in the Readme. The other low cost
    # models are not there yet. Add them back here, comma separated, once they
    # are: "gemini-3.5-flash-lite", "claude-sonnet-5", "gpt-5-nano".
    # Exported here rather than declared under variables:, since a project or
    # instance variable of that name would take precedence over the latter.
    # Needs OPENROUTER_API_KEY as a masked project variable.
    - export RKORAP_LLM_MODELS="z-ai/glm-5.3-flash,openai/gpt-6-luna"
    - export RKORAP_LIVE_TESTS=""
    - export RKORAP_BROWSER_TESTS=""
    - start_section docprompting "Prompting LLMs with the Readme"
    - echo -e "apt-cache\nccache\nrlib" >> .Rbuildignore
    - R -q -e 'devtools::test(filter = "readme-against-llm")'
    - end_section docprompting


# Opt-in scheduled server compatibility checks. Configure the interval and
# RKORAP_LIVE_TESTS=true in GitLab's pipeline schedules after this is merged.
live-korap-http-tests:
  extends: .install-rkorapclient
  image: rocker/tidyverse
  allow_failure: true
  cache:
    key: rkorapclient-ubuntu-stable
    paths:
      - apt-cache/
      - ccache/
      - rlib/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RKORAP_LIVE_TESTS == "true"'
  script:
    - export RKORAP_LIVE_TESTS=true
    - export RKORAP_BROWSER_TESTS=""
    - export RKORAP_LLM_MODELS=""
    - export NOT_CRAN=true
    - R -q -e 'devtools::test(filter = "^live-http$")'
